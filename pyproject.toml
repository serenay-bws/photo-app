[project]
name = "fotostudio"
version = "1.0.0"
description = "Lokale foto-app: AI upscaling (Real-ESRGAN) en VSCO-achtige bewerking"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pillow>=10.3",
    "pillow-heif>=0.16",
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "qrcode>=7.4",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
